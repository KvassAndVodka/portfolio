name: Deploy to Production

on:
  push:
    branches: ["main"]

# The jobs only check out code and run Docker on the self-hosted runner; the token needs nothing else.
permissions:
  contents: read

env:
  # Each run builds and deploys its own image tag, so a newer build cannot change an older deploy.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: self-hosted
    # A newer merge cancels an older build. Deploys are in a separate job and are never cancelled.
    concurrency:
      group: portfolio-build
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Deployment Target
        run: |
          if ! grep -qx 'DEPLOY_TARGET=production' deployment.env; then
            echo "::error::deployment.env must contain DEPLOY_TARGET=production"
            exit 1
          fi
          echo "Production deployment target verified."

      - name: Create .env from Secret
        env:
          CONTENT_OWNER_TOKEN: ${{ secrets.CONTENT_OWNER_TOKEN }}
        run: |
          # The quotes around 'EOF' are mandatory to stop $ expansion
          cat << 'EOF' > .env
          ${{ secrets.PORTFOLIO_ENV }}
          EOF
          # The owner token is its own secret, so it can be set or rotated without rewriting PORTFOLIO_ENV.
          if [ -n "$CONTENT_OWNER_TOKEN" ]; then printf 'CONTENT_OWNER_TOKEN=%s\n' "$CONTENT_OWNER_TOKEN" >> .env; fi

      - name: Verify Cloudflare Production Configuration
        run: |
          if ! grep -Eq '^CLOUDFLARE_TUNNEL_TOKEN=.+$' .env; then
            echo "::error::PORTFOLIO_ENV must contain CLOUDFLARE_TUNNEL_TOKEN"
            exit 1
          fi

          if ! grep -qx 'AUTH_URL=https://portfolio.jmraut.dev' .env; then
            echo "::error::AUTH_URL must be https://portfolio.jmraut.dev"
            exit 1
          fi

          if ! grep -qx 'NEXTAUTH_URL=https://portfolio.jmraut.dev' .env; then
            echo "::error::NEXTAUTH_URL must be https://portfolio.jmraut.dev"
            exit 1
          fi

      - name: Clean Docker Build Cache
        run: |
          echo "Pruning Docker build cache (keeping up to 1GB)..."
          docker builder prune -f --keep-storage=1gb
          echo "Removing portfolio images older than 24 hours..."
          # The age filter keeps an image that a queued deploy still needs. Skip the live image by name:
          # with the containerd image store, `docker image prune -a` also deletes an image that a running container uses.
          LIVE_IMAGE="$(docker inspect -f '{{.Config.Image}}' portfolio_web 2>/dev/null || true)"
          docker images --filter "until=24h" --filter "reference=portfolio*" --format '{{.Repository}}:{{.Tag}}' \
            | grep -vxF -e "$LIVE_IMAGE" -e portfolio:rollback \
            | xargs -r docker rmi || echo "::warning::Some old portfolio images could not be removed"
          docker image prune -f

      - name: Build New Image
        run: |
          echo "Building the web runner and one-shot migrator while existing containers keep running..."
          docker compose build web migrator

  deploy:
    needs: build
    runs-on: self-hosted
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env from Secret
        env:
          CONTENT_OWNER_TOKEN: ${{ secrets.CONTENT_OWNER_TOKEN }}
        run: |
          # The quotes around 'EOF' are mandatory to stop $ expansion
          cat << 'EOF' > .env
          ${{ secrets.PORTFOLIO_ENV }}
          EOF
          # The owner token is its own secret, so it can be set or rotated without rewriting PORTFOLIO_ENV.
          if [ -n "$CONTENT_OWNER_TOKEN" ]; then printf 'CONTENT_OWNER_TOKEN=%s\n' "$CONTENT_OWNER_TOKEN" >> .env; fi

      - name: Tag Running Image as Rollback
        run: |
          RUNNING_IMAGE="$(docker inspect -f '{{.Image}}' portfolio_web 2>/dev/null || true)"
          if [ -n "$RUNNING_IMAGE" ] && docker image inspect "$RUNNING_IMAGE" >/dev/null 2>&1; then
            docker tag "$RUNNING_IMAGE" portfolio:rollback
            echo "Tagged the running image as portfolio:rollback"
          elif [ -n "$RUNNING_IMAGE" ]; then
            # The image record is gone but the container still runs: save the container itself. If its layers
            # are gone too, keep an existing portfolio:rollback, and fail only when there is none.
            if docker commit portfolio_web portfolio:rollback; then
              echo "Saved the running container as portfolio:rollback"
            elif docker image inspect portfolio:rollback >/dev/null 2>&1; then
              echo "::warning::Could not save the running container. Keeping the existing portfolio:rollback."
            else
              echo "::error::No rollback image is available. Build one before deploying."
              exit 1
            fi
          else
            echo "No running portfolio container found, skipping rollback tag"
          fi

      - name: Deploy New Containers
        id: deploy
        run: |
          docker compose up -d postgres

          echo "Waiting for PostgreSQL to become healthy..."
          POSTGRES_READY=false
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_db 2>/dev/null)" = "healthy" ]; then
              POSTGRES_READY=true
              break
            fi
            sleep 2
          done

          if [ "$POSTGRES_READY" = "false" ]; then
            echo "::error::PostgreSQL did not become healthy"
            docker compose logs --tail=100 postgres
            exit 1
          fi

          echo "Applying database migrations..."
          docker compose run --rm --no-deps migrator

          # A migration failure leaves the currently running web container alone.
          # From this point forward, a failed replacement should restore its image.
          echo "web_replacement_attempted=true" >> "$GITHUB_OUTPUT"
          docker compose up -d --no-deps --force-recreate web
          docker image prune -f

      - name: Health Check
        id: healthcheck
        run: |
          echo "Waiting for app to initialize..."
          WEB_HEALTHY=false

          for i in $(seq 1 30); do
            echo "Health check attempt $i/30..."
            if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_web 2>/dev/null)" = "healthy" ]; then
              echo "App is healthy!"
              WEB_HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$WEB_HEALTHY" = "false" ]; then
            echo "::error::Web container did not become healthy"
            docker compose logs --tail=100 web
            exit 1
          fi

      - name: Rollback on Failure
        if: failure() && steps.deploy.outputs.web_replacement_attempted == 'true'
        run: |
          echo "::warning::Deployment failed — rolling back to previous image..."
          if docker image inspect portfolio:rollback >/dev/null 2>&1; then
            IMAGE_TAG=rollback docker compose up -d --no-deps --force-recreate web

            WEB_HEALTHY=false
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_web 2>/dev/null)" = "healthy" ]; then
                WEB_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$WEB_HEALTHY" = "false" ]; then
              echo "::error::Rolled-back web container did not become healthy"
              docker compose logs --tail=100 web
              exit 1
            fi

            echo "Rollback complete. Previous version restored and healthy."
          else
            echo "::error::No rollback image found! Cannot restore previous version."
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        if: success()
        run: |
          docker compose up -d --no-deps cloudflared

          CONNECTOR_STABLE=false
          STABLE_CHECKS=0
          LAST_RESTART_COUNT=""

          for i in $(seq 1 30); do
            RUNNING="$(docker inspect -f '{{.State.Running}}' portfolio_cloudflared 2>/dev/null || true)"
            RESTART_COUNT="$(docker inspect -f '{{.RestartCount}}' portfolio_cloudflared 2>/dev/null || true)"

            if [ "$RUNNING" = "true" ] && { [ -z "$LAST_RESTART_COUNT" ] || [ "$RESTART_COUNT" = "$LAST_RESTART_COUNT" ]; }; then
              STABLE_CHECKS=$((STABLE_CHECKS+1))
              if [ "$STABLE_CHECKS" -ge 3 ]; then
                CONNECTOR_STABLE=true
                break
              fi
            else
              STABLE_CHECKS=0
            fi

            LAST_RESTART_COUNT="$RESTART_COUNT"
            sleep 2
          done

          if [ "$CONNECTOR_STABLE" = "false" ]; then
            echo "::error::Cloudflare Tunnel connector did not remain stable"
            docker compose logs --tail=100 cloudflared
            exit 1
          fi

      - name: Verify Public Cloudflare Route
        if: success()
        run: |
          PUBLIC_READY=false

          for i in $(seq 1 30); do
            echo "Public health check attempt $i/30..."
            if curl --fail --silent --show-error --proto '=https' \
              --proto-redir '=https' --location --head \
              --max-time 15 https://portfolio.jmraut.dev >/dev/null; then
              PUBLIC_READY=true
              break
            fi
            sleep 5
          done

          if [ "$PUBLIC_READY" = "false" ]; then
            echo "::error::Cloudflare public route did not become healthy"
            docker compose logs --tail=100 cloudflared
            exit 1
          fi

      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        run: |
          INDEXNOW_KEY="$(grep -E '^INDEXNOW_KEY=' .env | head -n 1 | cut -d '=' -f2- | tr -d '\r\n')"
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY is not set; skipping IndexNow submission."
            exit 0
          fi

          SITEMAP_XML="$(curl --fail --silent --show-error --max-time 15 https://portfolio.jmraut.dev/sitemap.xml)"
          URL_LIST="$(printf '%s' "$SITEMAP_XML" | grep -oE '<loc>[^<]+</loc>' | sed -E 's|^<loc>(.*)</loc>$|\1|' | awk 'NF { printf "%s\"%s\"", (n++ ? "," : ""), $0 }')"

          if [ -z "$URL_LIST" ]; then
            echo "No URLs found in sitemap.xml; skipping IndexNow submission."
            exit 0
          fi

          PAYLOAD="$(printf '{"host":"portfolio.jmraut.dev","key":"%s","keyLocation":"https://portfolio.jmraut.dev/indexnow-key.txt","urlList":[%s]}' "$INDEXNOW_KEY" "$URL_LIST")"
          HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" \
            https://api.indexnow.org/indexnow)"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "IndexNow accepted sitemap submission (HTTP $HTTP_CODE)."
          else
            echo "::warning::IndexNow returned HTTP $HTTP_CODE"
          fi

      - name: Retire Tailscale Funnel Container
        if: success()
        run: |
          if docker container inspect tailscale >/dev/null 2>&1; then
            docker exec tailscale tailscale --socket=/tmp/tailscaled.sock funnel reset >/dev/null 2>&1 || true
            docker rm -f tailscale
            echo "Removed the retired Tailscale Funnel container."
          fi

          if docker volume inspect portfolio_tailscale_data >/dev/null 2>&1; then
            docker volume rm portfolio_tailscale_data
            echo "Removed the retired Tailscale state volume."
          fi

      - name: Tag Deployed Image as Latest
        if: success()
        run: |
          # Manual `docker compose` commands without IMAGE_TAG use :latest.
          docker tag "portfolio:$IMAGE_TAG" portfolio:latest
          docker image rm "portfolio:$IMAGE_TAG"

      - name: Clean Up Migrator Image
        if: always()
        run: |
          MIGRATOR_IMAGE_ID="$(docker compose images -q migrator 2>/dev/null || true)"
          docker compose rm -f migrator >/dev/null 2>&1 || true
          if [ -n "$MIGRATOR_IMAGE_ID" ]; then
            docker image rm "$MIGRATOR_IMAGE_ID" >/dev/null 2>&1 || true
          fi
