name: Deploy to Production

on:
  push:
    branches: ["main"]

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Deployment Target
        run: |
          if ! grep -qx 'DEPLOY_TARGET=production' deployment.env; then
            echo "::error::deployment.env must contain DEPLOY_TARGET=production"
            exit 1
          fi
          echo "Production deployment target verified."

      - name: Create .env from Secret
        run: |
          # The quotes around 'EOF' are mandatory to stop $ expansion
          cat << 'EOF' > .env
          ${{ secrets.PORTFOLIO_ENV }}
          EOF

      - name: Verify Cloudflare Production Configuration
        run: |
          if ! grep -Eq '^CLOUDFLARE_TUNNEL_TOKEN=.+$' .env; then
            echo "::error::PORTFOLIO_ENV must contain CLOUDFLARE_TUNNEL_TOKEN"
            exit 1
          fi

          if ! grep -qx 'AUTH_URL=https://portfolio.jmraut.dev' .env; then
            echo "::error::AUTH_URL must be https://portfolio.jmraut.dev"
            exit 1
          fi

          if ! grep -qx 'NEXTAUTH_URL=https://portfolio.jmraut.dev' .env; then
            echo "::error::NEXTAUTH_URL must be https://portfolio.jmraut.dev"
            exit 1
          fi

      - name: Clean Docker Build Cache
        run: |
          echo "Pruning Docker build cache (keeping up to 1GB)..."
          docker builder prune -f --keep-storage=1gb
          echo "Pruning unused Docker images..."
          docker image prune -af

      - name: Tag Current Image as Rollback
        run: |
          if docker image inspect portfolio:latest >/dev/null 2>&1; then
            docker tag portfolio:latest portfolio:rollback
            echo "Tagged current image as portfolio:rollback"
          else
            echo "No existing portfolio image found, skipping rollback tag"
          fi

      - name: Build New Image
        id: build
        run: |
          echo "Building the web runner and one-shot migrator while existing containers keep running..."
          docker compose build web migrator

      - name: Deploy New Containers
        id: deploy
        run: |
          docker compose up -d postgres

          echo "Waiting for PostgreSQL to become healthy..."
          POSTGRES_READY=false
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_db 2>/dev/null)" = "healthy" ]; then
              POSTGRES_READY=true
              break
            fi
            sleep 2
          done

          if [ "$POSTGRES_READY" = "false" ]; then
            echo "::error::PostgreSQL did not become healthy"
            docker compose logs --tail=100 postgres
            exit 1
          fi

          echo "Applying database migrations..."
          docker compose run --rm --no-deps migrator

          # A migration failure leaves the currently running web container alone.
          # From this point forward, a failed replacement should restore its image.
          echo "web_replacement_attempted=true" >> "$GITHUB_OUTPUT"
          docker compose up -d --no-deps --force-recreate web
          docker image prune -f

      - name: Health Check
        id: healthcheck
        run: |
          echo "Waiting for app to initialize..."
          WEB_HEALTHY=false

          for i in $(seq 1 30); do
            echo "Health check attempt $i/30..."
            if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_web 2>/dev/null)" = "healthy" ]; then
              echo "App is healthy!"
              WEB_HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$WEB_HEALTHY" = "false" ]; then
            echo "::error::Web container did not become healthy"
            docker compose logs --tail=100 web
            exit 1
          fi

      - name: Rollback on Failure
        if: failure() && steps.build.outcome == 'success' && steps.deploy.outputs.web_replacement_attempted == 'true'
        run: |
          echo "::warning::Deployment failed — rolling back to previous image..."
          if docker image inspect portfolio:rollback >/dev/null 2>&1; then
            docker tag portfolio:rollback portfolio:latest
            docker compose up -d --no-deps --force-recreate web

            WEB_HEALTHY=false
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_web 2>/dev/null)" = "healthy" ]; then
                WEB_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$WEB_HEALTHY" = "false" ]; then
              echo "::error::Rolled-back web container did not become healthy"
              docker compose logs --tail=100 web
              exit 1
            fi

            echo "Rollback complete. Previous version restored and healthy."
          else
            echo "::error::No rollback image found! Cannot restore previous version."
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        if: success()
        run: |
          docker compose up -d --no-deps cloudflared

          CONNECTOR_STABLE=false
          STABLE_CHECKS=0
          LAST_RESTART_COUNT=""

          for i in $(seq 1 30); do
            RUNNING="$(docker inspect -f '{{.State.Running}}' portfolio_cloudflared 2>/dev/null || true)"
            RESTART_COUNT="$(docker inspect -f '{{.RestartCount}}' portfolio_cloudflared 2>/dev/null || true)"

            if [ "$RUNNING" = "true" ] && { [ -z "$LAST_RESTART_COUNT" ] || [ "$RESTART_COUNT" = "$LAST_RESTART_COUNT" ]; }; then
              STABLE_CHECKS=$((STABLE_CHECKS+1))
              if [ "$STABLE_CHECKS" -ge 3 ]; then
                CONNECTOR_STABLE=true
                break
              fi
            else
              STABLE_CHECKS=0
            fi

            LAST_RESTART_COUNT="$RESTART_COUNT"
            sleep 2
          done

          if [ "$CONNECTOR_STABLE" = "false" ]; then
            echo "::error::Cloudflare Tunnel connector did not remain stable"
            docker compose logs --tail=100 cloudflared
            exit 1
          fi

      - name: Verify Public Cloudflare Route
        if: success()
        run: |
          PUBLIC_READY=false

          for i in $(seq 1 30); do
            echo "Public health check attempt $i/30..."
            if curl --fail --silent --show-error --proto '=https' \
              --proto-redir '=https' --location --head \
              --max-time 15 https://portfolio.jmraut.dev >/dev/null; then
              PUBLIC_READY=true
              break
            fi
            sleep 5
          done

          if [ "$PUBLIC_READY" = "false" ]; then
            echo "::error::Cloudflare public route did not become healthy"
            docker compose logs --tail=100 cloudflared
            exit 1
          fi

      - name: Retire Tailscale Funnel Container
        if: success()
        run: |
          if docker container inspect tailscale >/dev/null 2>&1; then
            docker exec tailscale tailscale --socket=/tmp/tailscaled.sock funnel reset >/dev/null 2>&1 || true
            docker rm -f tailscale
            echo "Removed the retired Tailscale Funnel container."
          fi

          if docker volume inspect portfolio_tailscale_data >/dev/null 2>&1; then
            docker volume rm portfolio_tailscale_data
            echo "Removed the retired Tailscale state volume."
          fi

      - name: Clean Up Migrator Image
        if: always()
        run: |
          MIGRATOR_IMAGE_ID="$(docker compose images -q migrator 2>/dev/null || true)"
          docker compose rm -f migrator >/dev/null 2>&1 || true
          if [ -n "$MIGRATOR_IMAGE_ID" ]; then
            docker image rm "$MIGRATOR_IMAGE_ID" >/dev/null 2>&1 || true
          fi
